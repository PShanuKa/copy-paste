<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Live Clipboard</title>
<style>
  :root{
    --bg:#0f1115; --panel:#171a21; --line:#272b35; --text:#e6e8ee;
    --muted:#9aa3b2; --accent:#4f8cff; --ok:#31c48d; --warn:#f0b429;
  }
  @media (prefers-color-scheme: light){
    :root{ --bg:#f4f6fa; --panel:#fff; --line:#dfe3ea; --text:#12151b; --muted:#5b6577; }
  }
  *{box-sizing:border-box}
  body{margin:0;font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
       background:var(--bg);color:var(--text);display:flex;justify-content:center;padding:24px 16px}
  .wrap{width:100%;max-width:820px}
  h1{font-size:20px;margin:0 0 4px}
  .sub{color:var(--muted);font-size:13px;margin:0 0 18px}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
  label{font-size:13px;color:var(--muted)}
  select,button{font:inherit;border-radius:8px;border:1px solid var(--line);
       background:transparent;color:var(--text);padding:9px 14px;cursor:pointer}
  select{background:var(--bg)}
  button:hover{border-color:var(--accent)}
  button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  textarea{width:100%;min-height:260px;resize:vertical;padding:12px;border-radius:10px;
       border:1px solid var(--line);background:var(--bg);color:var(--text);
       font:14px/1.6 ui-monospace,SFMono-Regular,Consolas,monospace}
  .bar{display:flex;justify-content:space-between;align-items:center;gap:10px;
       margin-top:10px;font-size:12.5px;color:var(--muted);flex-wrap:wrap}
  .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--muted);margin-right:6px}
  .dot.live{background:var(--ok)}
  .dot.off{background:var(--warn)}
  .credit{margin:18px 0 0;text-align:center;font-size:12.5px;color:var(--muted)}
  .credit strong{color:var(--text);font-weight:600}
  .credit a{color:var(--accent);text-decoration:none}
  .credit a:hover{text-decoration:underline}
  #toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);opacity:0;
       background:var(--panel);border:1px solid var(--line);padding:10px 16px;border-radius:999px;
       transition:.2s;pointer-events:none;font-size:13px}
  #toast.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<div class="wrap">
  <h1>Live Clipboard</h1>
  <p class="sub">Pick a channel and start typing — everyone on that channel sees it live and can copy it.</p>

  <div class="panel">
    <div class="row">
      <label for="server">Channel</label>
      <select id="server"></select>
      <button id="copy" class="primary">📋 Copy</button>
      <button id="paste">📥 Paste</button>
      <button id="clear">🗑 Clear</button>
    </div>

    <textarea id="text" placeholder="Enter your value here…" spellcheck="false"></textarea>

    <div class="bar">
      <span><span id="dot" class="dot"></span><span id="status">connecting…</span></span>
      <span id="meta"></span>
    </div>
  </div>

  <p class="credit">
    Developed by <strong>Pasindu Shanuka</strong>
    · <a href="tel:+94714700007">071 4 700007</a>
    · <a href="https://wa.me/94711983010" target="_blank" rel="noopener">WhatsApp 071 198 3010</a>
  </p>
</div>
<div id="toast"></div>

<script>
const $ = id => document.getElementById(id);
const selServer = $('server'), ta = $('text'), dot = $('dot'), statusEl = $('status'), metaEl = $('meta');

let current = localStorage.getItem('channel') || '';
let version = -1;          // last version we know about from the server
let lastTyped = 0;         // ts of last local keystroke
let pushTimer = null;
let pending = false;       // we have local text not yet pushed
let stop = false;          // abort in-flight poll after channel switch

const toast = msg => {
  const t = $('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), 1600);
};
const setLive = (on, txt) => { dot.className = 'dot ' + (on ? 'live' : 'off'); statusEl.textContent = txt; };

// ---- load channel list ----------------------------------------------------
async function init(){
  const { servers } = await (await fetch('/api/servers')).json();
  selServer.innerHTML = servers.map(s => `<option>${s}</option>`).join('');
  if (!servers.includes(current)) current = servers[0];
  selServer.value = current;
  switchTo(current);
}

function switchTo(name){
  stop = true;                       // let the old poll loop die
  current = name;
  localStorage.setItem('channel', name);
  version = -1; pending = false;
  ta.value = '';
  setTimeout(() => { stop = false; loop(); }, 0);
}

// ---- apply remote value ---------------------------------------------------
function apply(slot){
  if (slot.version === version) return;
  version = slot.version;
  const typingNow = Date.now() - lastTyped < 1500;
  if (!typingNow && !pending && ta.value !== slot.text){
    const atEnd = ta.selectionStart === ta.value.length;
    ta.value = slot.text;
    if (atEnd) ta.selectionStart = ta.selectionEnd = ta.value.length;
  }
  metaEl.textContent = (slot.updatedAt ? 'updated ' + new Date(slot.updatedAt).toLocaleTimeString() : 'empty')
                     + ' · v' + slot.version + ' · ' + slot.text.length + ' chars';
}

// ---- long-poll loop (falls back to a plain 5s poll on error) --------------
async function loop(){
  const mine = current;
  while (!stop && mine === current){
    try {
      const wait = version >= 0 ? '&wait=1' : '';
      const r = await fetch(`/api/clip?server=${encodeURIComponent(mine)}&since=${version}${wait}`);
      if (!r.ok) throw new Error(r.status);
      const slot = await r.json();
      if (mine !== current) return;
      setLive(true, 'live · ' + mine);
      apply(slot);
    } catch (e) {
      if (mine !== current) return;
      setLive(false, 'reconnecting…');
      await new Promise(r => setTimeout(r, 5000));   // retry every 5s
    }
  }
}

// ---- push local edits -----------------------------------------------------
async function push(){
  const body = JSON.stringify({ server: current, text: ta.value });
  try {
    const r = await fetch('/api/clip', { method:'POST', headers:{'Content-Type':'application/json'}, body });
    const slot = await r.json();
    pending = false;
    version = slot.version;                 // our own write; don't echo it back
    metaEl.textContent = 'saved · v' + slot.version + ' · ' + slot.text.length + ' chars';
  } catch (e) { setLive(false, 'save failed — retrying'); setTimeout(push, 3000); }
}

ta.addEventListener('input', () => {
  lastTyped = Date.now(); pending = true;
  clearTimeout(pushTimer);
  pushTimer = setTimeout(push, 400);        // debounce
});

selServer.addEventListener('change', e => switchTo(e.target.value));

$('copy').addEventListener('click', async () => {
  try { await navigator.clipboard.writeText(ta.value); }
  catch (e) { ta.select(); document.execCommand('copy'); }   // http / older browsers
  toast('Copied ✔');
});

$('paste').addEventListener('click', async () => {
  try {
    const t = await navigator.clipboard.readText();
    ta.value = t; lastTyped = Date.now(); pending = true; await push();
    toast('Pasted & synced ✔');
  } catch (e) { toast('Clipboard read blocked — use Ctrl+V instead'); ta.focus(); }
});

$('clear').addEventListener('click', () => { ta.value=''; pending=true; push(); toast('Cleared'); });

init();
</script>
</body>
</html>
